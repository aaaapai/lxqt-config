name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CC: clang
  CXX: clang++

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # 添加 LXQt 官方 PPA 以获取 2.4.0+ 版本
    - name: Add LXQt PPA
      run: |
        sudo apt-get update
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository -y ppa:lxqt/lxqt
        sudo apt-get update

    - name: Install system dependencies
      run: |
        sudo apt-get install -y \
          cmake \
          g++ \
          liblxqt-dev \
          liblxqt-menu-data-dev \
          libkf5windowsystem-dev \
          libkf5wayland-dev \
          libxcb-randr0-dev \
          libxcb-util0-dev \
          libgl1-mesa-dev \
          extra-cmake-modules \
          ninja-build \
          libwayland-dev \
          wayland-protocols

    - name: Install Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.6.0'
        host: 'linux'
        target: 'desktop'
        arch: 'gcc_64'
        archives: 'qtbase qtdeclarative qttools qtwayland'

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ github.job }}-${{ runner.os }}

    - name: Configure CMake
      run: |
        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_INSTALL_PREFIX=/usr
        # CMAKE_PREFIX_PATH 已由 install-qt-action 自动设置

    - name: Build
      run: |
        cmake --build build --config Release

    - name: Install to staging area
      run: |
        cmake --install build --prefix ./install

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: lxqt-config-binaries
        path: ./install/

    - name: Show ccache stats
      run: ccache --show-stats